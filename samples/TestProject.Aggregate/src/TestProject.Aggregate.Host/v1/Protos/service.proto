// Shared gRPC service definition for the Aggregate host.
// Imports shared.proto for reusable message types.

syntax = "proto3";

option csharp_namespace = "TestProject.Aggregate.Host.v1.Protos";

package TestProject.Aggregate.v1;

import "shared.proto";

service AggregateRpc {
  rpc HandleContainer (HandleContainerRequest) returns (HandleContainerReply);
  rpc ListContainers (ListContainersRequest) returns (ListContainersReply);
}

message HandleContainerRequest {
  string container_no = 1;
  string iso_code = 2;
}

message HandleContainerReply {
  bool success = 1;
  string message = 2;
}

message ListContainersRequest {
  string bill_no = 1;
}

message ListContainersReply {
  repeated SharedContainerInfo items = 1;
  int32 total = 2;
}
