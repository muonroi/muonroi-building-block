name: Feature Request
description: Propose a new capability or developer experience improvement
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Change
      description: Describe the expected API, workflow, or operator behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: textarea
    id: scope
    attributes:
      label: Boundary Notes
      description: Mention whether this belongs in the public packages, control-plane, or license-server.
  - type: textarea
    id: docs
    attributes:
      label: Docs Or Samples Impact
      description: Which guides, references, or sample apps would need to change?
