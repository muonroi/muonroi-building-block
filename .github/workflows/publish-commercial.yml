# DEPRECATED: This workflow is superseded by publish-all.yml
# which publishes ALL packages (OSS + Commercial) with a single unified version.
# Kept for reference only. Use tag prefix "v*" with publish-all.yml instead of "pro-v*".
name: "[DEPRECATED] Publish Commercial NuGet Packages"

on:
  push:
    tags:
      - 'pro-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pack but do not push)'
        type: boolean
        default: true
      version_override:
        description: 'Override version (e.g. 1.0.0-alpha.2)'
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build + Full Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check modular boundaries
        run: pwsh scripts/check-modular-boundaries.ps1 -RepoRoot .

      - name: Restore
        run: dotnet restore Muonroi.BuildingBlock.sln

      - name: Build Release
        run: dotnet build Muonroi.BuildingBlock.sln -c Release --no-restore

      - name: Test All
        run: dotnet test Muonroi.BuildingBlock.sln -c Release --no-build --verbosity minimal

  pack-and-push:
    name: Pack & Push Commercial
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Muonroi.BuildingBlock.sln

      - name: Build Release
        run: dotnet build Muonroi.BuildingBlock.sln -c Release --no-restore

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/pro-v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/pro-v}"
          echo "PACKAGE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch' && inputs.version_override != ''
        run: echo "PACKAGE_VERSION=${{ inputs.version_override }}" >> "$GITHUB_ENV"

      - name: Pack Commercial packages
        run: |
          ARTIFACTS_DIR="./artifacts/commercial"
          mkdir -p "$ARTIFACTS_DIR"

          COMMERCIAL_PROJECTS=(
            "src/Muonroi.Governance.Enterprise"
            "src/Muonroi.AuthZ"
            "src/Muonroi.Caching.Redis"
            "src/Muonroi.Messaging.MassTransit"
            "src/Muonroi.BackgroundJobs.Hangfire"
            "src/Muonroi.BackgroundJobs.Quartz"
            "src/Muonroi.SignalR"
            "src/Muonroi.Grpc"
            "src/Muonroi.Secrets"
            "src/Muonroi.Bff"
            "src/Muonroi.ServiceDiscovery.Consul"
            "src/Muonroi.RuleEngine.Runtime"
            "src/Muonroi.RuleEngine.Runtime.Web"
            "src/Muonroi.RuleEngine.DecisionTable.Web"
            "src/Muonroi.RuleEngine.Proliferation"
            "src/Muonroi.RuleEngine.Proliferation.Persistence"
            "src/Muonroi.Integration.Connectors"
            "src/Muonroi.Integration.Persistence"
            "src/Muonroi.Kubernetes"
            "src/Muonroi.UiEngine.Catalog"
            "src/Muonroi.BuildingBlock.All"
          )

          for proj in "${COMMERCIAL_PROJECTS[@]}"; do
            PACK_ARGS="-c Release -o $ARTIFACTS_DIR"
            if [ -n "${PACKAGE_VERSION:-}" ]; then
              PACK_ARGS="$PACK_ARGS -p:Version=$PACKAGE_VERSION"
            fi
            echo "Packing $proj..."
            dotnet pack "$proj" $PACK_ARGS
          done

      - name: Push to GitHub Packages (private feed)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          dotnet nuget push "./artifacts/commercial/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/muonroi/index.json" \
            --skip-duplicate

      - name: Push to NuGet.org
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          dotnet nuget push "./artifacts/commercial/*.nupkg" \
            --api-key "${{ secrets.NUGET_ORG_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Upload artifacts (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: commercial-packages-dryrun
          path: ./artifacts/commercial/*.nupkg
