name: Build Control Plane Dashboard

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
    paths:
      - "tools/Muonroi.ControlPlane.Dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
    paths:
      - "tools/Muonroi.ControlPlane.Dashboard/**"
      - ".github/workflows/dashboard.yml"

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "tools/Muonroi.ControlPlane.Dashboard/package-lock.json"

      - name: Install
        run: npm ci
        working-directory: tools/Muonroi.ControlPlane.Dashboard

      - name: Build
        run: npm run build
        working-directory: tools/Muonroi.ControlPlane.Dashboard

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: control-plane-dashboard-dist
          path: tools/Muonroi.ControlPlane.Dashboard/dist
