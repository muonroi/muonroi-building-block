# Unified publish workflow — replaces publish-oss.yml and publish-commercial.yml
# Ensures ALL packages are published with the SAME version in a single run,
# eliminating version drift between OSS and Commercial feeds.
name: Publish All NuGet Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (pack but do not push)'
        type: boolean
        default: true
      version_override:
        description: 'Override version (e.g. 1.0.0-alpha.2). Leave empty to use csproj version.'
        type: string
        default: ''

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────
  # 1. Validate: boundary check + build + test
  # ─────────────────────────────────────────────
  validate:
    name: Validate Boundary + Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore strong-name key
        run: echo "${{ secrets.MUONROI_SNK_BASE64 }}" | base64 -d > Muonroi.snk

      - name: Check modular boundaries
        run: pwsh scripts/check-modular-boundaries.ps1 -RepoRoot .

      - name: Restore
        run: dotnet restore Muonroi.BuildingBlock.sln

      - name: Build Release
        run: dotnet build Muonroi.BuildingBlock.sln -c Release --no-restore

      - name: Test (exclude Commercial-only and Integration tests)
        run: dotnet test Muonroi.BuildingBlock.sln -c Release --no-build --filter "Category!=Commercial&Category!=Integration&FullyQualifiedName!~WorkflowCacheTelemetryTests" --verbosity minimal

  # ─────────────────────────────────────────────
  # 2. Pack every project, push everywhere
  # ─────────────────────────────────────────────
  pack-and-push:
    name: Pack & Push All Packages
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore strong-name key
        run: echo "${{ secrets.MUONROI_SNK_BASE64 }}" | base64 -d > Muonroi.snk

      - name: Restore
        run: dotnet restore Muonroi.BuildingBlock.sln

      - name: Build Release
        run: dotnet build Muonroi.BuildingBlock.sln -c Release --no-restore

      # ── Determine version ──────────────────────
      - name: Set version from tag (if triggered by tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "PACKAGE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Set version from input override (if manual trigger)
        if: github.event_name == 'workflow_dispatch' && inputs.version_override != ''
        run: echo "PACKAGE_VERSION=${{ inputs.version_override }}" >> "$GITHUB_ENV"

      # ── Pack ALL projects (deduplicated) ───────
      - name: Pack all packages
        run: |
          ARTIFACTS_DIR="./artifacts/all"
          mkdir -p "$ARTIFACTS_DIR"

          # ────────────────────────────────────────
          # Deduplicated union of OSS + Commercial
          # ────────────────────────────────────────
          # OSS-only projects
          ALL_PROJECTS=(
            "src/Muonroi.Core.Abstractions"
            "src/Muonroi.Core"
            "src/Muonroi.Governance.Abstractions"
            "src/Muonroi.Governance"
            "src/Muonroi.Tenancy.Abstractions"
            "src/Muonroi.Tenancy.Core"
            "src/Muonroi.Tenancy"
            "src/Muonroi.Tenancy.SiteProfile"
            "src/Muonroi.Tenancy.SiteProfile.SourceGenerators"
            "src/Muonroi.Tenancy.SiteProfile.Web"
            "src/Muonroi.RuleEngine.Abstractions"
            "src/Muonroi.RuleEngine.Core"
            "src/Muonroi.RuleEngine.SourceGenerators"
            "src/Muonroi.RuleEngine.Testing"
            "src/Muonroi.RuleEngine.DecisionTable"
            # Muonroi.RuleEngine.NRules excluded — [FROZEN] deprecated, use RuleEngine.Runtime
            "src/Muonroi.RuleEngine.CEP"
            "src/Muonroi.Quota.Abstractions"
            "src/Muonroi.Data.Abstractions"
            "src/Muonroi.Data.Dapper"
            "src/Muonroi.Data.EntityFrameworkCore"
            "src/Muonroi.EntityFrameworkCore.Configuration"
            "src/Muonroi.Caching.Abstractions"
            "src/Muonroi.Caching.Memory"
            "src/Muonroi.Auth"
            "src/Muonroi.AspNetCore"
            "src/Muonroi.AspNetCore.OpenApi"
            "src/Muonroi.Http"
            "src/Muonroi.Resilience"
            "src/Muonroi.Mapper"
            "src/Muonroi.Mapping.Abstractions"
            "src/Muonroi.Mediator"
            "src/Muonroi.Messaging.Abstractions"
            "src/Muonroi.Observability"
            "src/Muonroi.BackgroundJobs.Abstractions"
            "src/Muonroi.BuildingBlock.Shared"
            "src/Muonroi.Logging"
            "src/Muonroi.Logging.Abstractions"
            "src/Muonroi.Integration.Abstractions"
            "src/Muonroi.Diagnostics.Generator"
            "src/Muonroi.Diagnostics"
            "src/Muonroi.Services"
            "src/Muonroi.Rules"
            "src/Muonroi.Tenancy.SiteProfile.Grpc"
            "src/Muonroi.AspNetCore.RuleEngine"
            # Shared projects (in both OSS and Commercial)
            "src/Muonroi.BackgroundJobs.Hangfire"
            "src/Muonroi.BackgroundJobs.Quartz"
            "src/Muonroi.Bff"
            "src/Muonroi.BuildingBlock.All"
            "src/Muonroi.Caching.Redis"
            "src/Muonroi.Data.EntityFrameworkCore.Events"
            "src/Muonroi.Grpc"
            "src/Muonroi.Kubernetes"
            "src/Muonroi.Messaging.MassTransit"
            "src/Muonroi.Secrets"
            "src/Muonroi.ServiceDiscovery.Consul"
            "src/Muonroi.SignalR"
            "src/Muonroi.RuleEngine.DecisionTable.Web"
            "src/Muonroi.RuleEngine.Runtime"
            "src/Muonroi.RuleEngine.Runtime.Web"
            "src/Muonroi.RuleEngine.Proliferation"
            "src/Muonroi.RuleEngine.Proliferation.Persistence"
            "src/Muonroi.UiEngine.Catalog"
            # Commercial-only projects
            "src/Muonroi.Governance.Enterprise"
            "src/Muonroi.AuthZ"
            "src/Muonroi.Integration.Connectors"
            "src/Muonroi.Integration.Persistence"
          )

          for proj in "${ALL_PROJECTS[@]}"; do
            PACK_ARGS="-c Release -o $ARTIFACTS_DIR"
            if [ -n "${PACKAGE_VERSION:-}" ]; then
              PACK_ARGS="$PACK_ARGS -p:Version=$PACKAGE_VERSION"
            fi
            echo "Packing $proj..."
            dotnet pack "$proj" $PACK_ARGS
          done

          # Template pack (PackageType=Template — separate from library packages)
          TEMPLATE_PACK_ARGS="-c Release -o $ARTIFACTS_DIR"
          if [ -n "${PACKAGE_VERSION:-}" ]; then
            TEMPLATE_PACK_ARGS="$TEMPLATE_PACK_ARGS -p:PackageVersion=$PACKAGE_VERSION"
          fi
          echo "Packing Host.Tenant.Templates..."
          dotnet pack "templates/Muonroi.Templates.csproj" $TEMPLATE_PACK_ARGS

      - name: List artifacts
        run: ls -la ./artifacts/all/

      # ── Push to NuGet.org (ALL packages) ───────
      - name: Push to NuGet.org
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          dotnet nuget push "./artifacts/all/*.nupkg" \
            --api-key "${{ secrets.NUGET_ORG_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      # ── Push commercial packages to GitHub Packages ──
      - name: Push commercial packages to GitHub Packages
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        run: |
          # Commercial packages that also go to the private GitHub Packages feed
          COMMERCIAL_PACKAGES=(
            "Muonroi.Governance.Enterprise"
            "Muonroi.AuthZ"
            "Muonroi.Caching.Redis"
            "Muonroi.Messaging.MassTransit"
            "Muonroi.BackgroundJobs.Hangfire"
            "Muonroi.BackgroundJobs.Quartz"
            "Muonroi.SignalR"
            "Muonroi.Grpc"
            "Muonroi.Secrets"
            "Muonroi.Bff"
            "Muonroi.ServiceDiscovery.Consul"
            "Muonroi.RuleEngine.Runtime"
            "Muonroi.RuleEngine.Runtime.Web"
            "Muonroi.RuleEngine.DecisionTable.Web"
            "Muonroi.RuleEngine.Proliferation"
            "Muonroi.RuleEngine.Proliferation.Persistence"
            "Muonroi.Integration.Connectors"
            "Muonroi.Integration.Persistence"
            "Muonroi.Kubernetes"
            "Muonroi.UiEngine.Catalog"
            "Muonroi.BuildingBlock.All"
          )

          for pkg in "${COMMERCIAL_PACKAGES[@]}"; do
            # Match all .nupkg files whose filename starts with the package name
            for nupkg in ./artifacts/all/${pkg}.*.nupkg; do
              if [ -f "$nupkg" ]; then
                echo "Pushing $nupkg to GitHub Packages..."
                dotnet nuget push "$nupkg" \
                  --api-key "${{ secrets.GITHUB_TOKEN }}" \
                  --source "https://nuget.pkg.github.com/muonroi/index.json" \
                  --skip-duplicate
              fi
            done
          done

      # ── Dry-run artifact upload ────────────────
      - name: Upload artifacts (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: all-packages-dryrun
          path: ./artifacts/all/*.nupkg
