title: "[Show and Tell] "
labels:
  - showcase
body:
  - type: markdown
    attributes:
      value: |
        Share a sample, rule template, or integration pattern built with Muonroi.
  - type: input
    id: project
    attributes:
      label: Project or sample name
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What you built
    validations:
      required: true
  - type: textarea
    id: lessons
    attributes:
      label: Lessons learned
