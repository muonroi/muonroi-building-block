image:
  repository: ghcr.io/owner/worker
  tag: latest
  pullPolicy: IfNotPresent
livenessProbe:
  command: ["/bin/sh", "-c", "echo ok"]
  initialDelaySeconds: 10
  periodSeconds: 10
readinessProbe:
  command: ["/bin/sh", "-c", "echo ok"]
  initialDelaySeconds: 5
  periodSeconds: 10
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
env: []
