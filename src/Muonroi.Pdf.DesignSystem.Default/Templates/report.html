<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 20pt; color: #222; }
.report-title-block { display: block; width: 100%; margin-bottom: 16pt; border-bottom: 2px solid #333; padding-bottom: 8pt; }
.report-title-block h1 { font-size: 22pt; font-weight: bold; margin: 0 0 4pt 0; }
.report-meta { display: table; width: 100%; margin-top: 8pt; }
.report-meta-row { display: table-row; }
.report-meta-label { display: table-cell; width: 20%; font-size: 10pt; font-weight: bold; padding: 2pt 0; color: #555; }
.report-meta-value { display: table-cell; font-size: 10pt; padding: 2pt 0; }
.section { display: block; width: 100%; margin-top: 20pt; }
.section h2 { font-size: 16pt; font-weight: bold; margin: 0 0 8pt 0; border-bottom: 1px solid #ccc; padding-bottom: 4pt; }
.summary-text { display: block; font-size: 10pt; line-height: 1.5; margin-top: 8pt; }
table.data-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 12pt; }
table.data-table th { background-color: #444; color: #fff; padding: 6pt 8pt; font-size: 10pt; text-align: left; font-weight: bold; }
table.data-table td { padding: 5pt 8pt; font-size: 10pt; border-bottom: 1px solid #e0e0e0; }
table.data-table tr.alt-row td { background-color: #f9f9f9; }
.page-break { page-break-before: always; }
.report-footer { display: block; margin-top: 24pt; font-size: 9pt; color: #888; border-top: 1px solid #ddd; padding-top: 6pt; }
@page { margin: 20mm; }
</style>
</head>
<body>
<div class="report-title-block">
  <h1>{{ReportTitle}}</h1>
  <div class="report-meta">
    <div class="report-meta-row">
      <div class="report-meta-label">Date:</div>
      <div class="report-meta-value">{{ReportDate}}</div>
    </div>
    <div class="report-meta-row">
      <div class="report-meta-label">Prepared by:</div>
      <div class="report-meta-value">{{PreparedBy}}</div>
    </div>
  </div>
</div>
<div class="section">
  <h2>Executive Summary</h2>
  <div class="summary-text">{{SummaryText}}</div>
</div>
<div class="section">
  <h2>Data</h2>
  <table class="data-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Description</th>
        <th>Value</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody>{{DataTableRows}}</tbody>
  </table>
</div>
<div class="report-footer">Confidential — {{ReportTitle}} — {{ReportDate}}</div>
</body>
</html>
